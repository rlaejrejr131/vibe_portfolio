<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Duckflix</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1 class="logo">Duckflix</h1>
            <nav class="nav">
                <a href="#" class="nav-link active">홈</a>
                <a href="#" class="nav-link">영화</a>
                <a href="#" class="nav-link">시리즈</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="hero-section">
            <h2 class="section-title">현재 상영 중인 영화</h2>
            <div class="movies-container" id="moviesContainer">
                <div class="loading">영화를 불러오는 중...</div>
            </div>
            <button class="load-more-btn" id="loadMoreBtn" style="display: none;">더보기</button>
        </section>

        <section class="hero-section">
            <h2 class="section-title">인기있는 영화</h2>
            <div class="movies-container" id="popularMoviesContainer">
                <div class="loading">영화를 불러오는 중...</div>
            </div>
            <button class="load-more-btn" id="popularLoadMoreBtn" style="display: none;">더보기</button>
        </section>
    </main>

    <!-- 모달 -->
    <div class="modal" id="movieModal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-header" id="modalHeader">
                <div class="modal-loading">로딩 중...</div>
            </div>
            <div class="modal-body">
                <!-- 평점 및 리뷰 작성 섹션 -->
                <div class="rating-review-section">
                    <h3 class="rating-title">평점 및 리뷰 작성</h3>
                    <div class="rating-input-container">
                        <div class="rating-value-display">
                            <span id="ratingValue">0</span>/10
                        </div>
                        <div class="star-rating" id="starRating">
                            <div class="star-group">
                                <span class="star" data-rating="1">⭐</span>
                                <span class="star" data-rating="2">⭐</span>
                            </div>
                            <div class="star-group">
                                <span class="star" data-rating="3">⭐</span>
                                <span class="star" data-rating="4">⭐</span>
                            </div>
                            <div class="star-group">
                                <span class="star" data-rating="5">⭐</span>
                                <span class="star" data-rating="6">⭐</span>
                            </div>
                            <div class="star-group">
                                <span class="star" data-rating="7">⭐</span>
                                <span class="star" data-rating="8">⭐</span>
                            </div>
                            <div class="star-group">
                                <span class="star" data-rating="9">⭐</span>
                                <span class="star" data-rating="10">⭐</span>
                            </div>
                        </div>
                    </div>
                    <div class="write-review-section">
                        <textarea id="reviewTextarea" placeholder="리뷰를 작성해주세요..." rows="4"></textarea>
                    </div>
                    <div class="rating-buttons">
                        <button class="submit-rating-review-btn" id="submitRatingReviewBtn">평점 및 리뷰 등록</button>
                    </div>
                </div>

                <h3 class="reviews-title">리뷰 <span id="reviewsCount" class="reviews-count">(0)</span></h3>
                <div class="reviews-container" id="reviewsContainer">
                    <div class="loading">리뷰를 불러오는 중...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="js/script.js"></script>
</body>
</html>
